[platformio]
src_dir = esp32/src

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -I core
    ; Ti dve vrstici poskrbita, da Serial izpis deluje preko USB-ja na S3:
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1